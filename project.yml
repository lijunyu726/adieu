name: Adieu
options:
  bundleIdPrefix: com.ljy
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.1.16"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Adieu:
    type: application
    platform: macOS
    sources: [Adieu, Shared]
    info:
      path: Adieu/Info.plist
      properties:
        CFBundleDisplayName: Adieu
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, zh-Hant, en, ja, ko, es, fr, de]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Adieu"
        NSAppleEventsUsageDescription: "Adieu 要通过“系统事件”列出“登录时打开”的应用，你关掉哪个它才能帮你关。不会控制别的东西。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ljy.adieu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: AdieuWidget
        embed: true
  AdieuWidget:
    type: app-extension
    platform: macOS
    sources:
      - AdieuWidget
      - Shared
      - path: Adieu/Localizable.xcstrings
    info:
      path: AdieuWidget/Info.plist
      properties:
        CFBundleDisplayName: Adieu
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # 写在这里：xcodegen 每次按 properties 重新生成这个文件，直接改文件会被覆盖。
    # 小组件不开沙盒系统就不登记；只读主程序写下的 widget.json 所在文件夹
    entitlements:
      path: AdieuWidget/AdieuWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/Adieu/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ljy.adieu.widget
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
